format_version = 5
id = "psx.enhancement.pgxp"
version = "1.0.0"
name = "Ape Escape PGXP Precision"
author = "Ape Escape Recompiled"
license = "GPL-3.0-only"
description = "Subpixel geometry and perspective-correct textures using the shared PGXP backend."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94423"

[[feature]]
id = "pgxp"
name = "PGXP Precision"
description = "Reduce polygon wobble and texture warping. Precision is validated against the actual packet words. Turn off for the original geometry and texture placement."
group = "Visual"
default_enabled = true

[[option]]
feature = "pgxp"
id = "cpu_mode"
label = "CPU precision propagation"
description = "Follow precision through the game's integer vertex calculations."
type = "boolean"
default = "true"

[[option]]
feature = "pgxp"
id = "geometry"
label = "Geometry correction"
description = "Use subpixel vertex positions to reduce polygon wobble."
group = "Visual"
type = "boolean"
default = "true"

[[option]]
feature = "pgxp"
id = "perspective"
label = "Perspective textures"
description = "Correct texture perspective to reduce warping, independently of geometry correction."
group = "Visual"
type = "boolean"
default = "true"

[[plugin]]
feature = "pgxp"
id = "psx.pgxp"
