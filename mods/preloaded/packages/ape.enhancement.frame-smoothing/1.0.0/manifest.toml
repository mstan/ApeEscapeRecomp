format_version = 5
id = "ape.enhancement.frame-smoothing"
version = "1.0.0"
name = "Ape Escape Frame Rate"
author = "mstan"
description = "Intermediate motion rendered with the game's own drawing code. Game logic, timers, and audio remain at their stock cadence. Requires OpenGL."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94423"
disc_sha256 = "1ae17e78ebb8c782c7c1785b0a0bd7b0ee28235b8a0c83c8df887129899a852a"

[[feature]]
id = "temporal-blending"
name = "Interpolated Rendering"
description = "Redraw the scene with interpolated model and camera transforms without accelerating gameplay. New geometry and camera cuts retain their current pose."
group = "Frame Rate"
default_enabled = false

[[option]]
feature = "temporal-blending"
id = "rate"
label = "Presentation rate"
description = "Follow the display for even cadence, or choose a fixed diagnostic rate. The original game simulation remains untouched. Requires OpenGL."
group = "Frame Rate"
type = "choice"
default = "display"

[[option.choice]]
value = "60"
label = "60 FPS"

[[option.choice]]
value = "90"
label = "90 FPS"

[[option.choice]]
value = "120"
label = "120 FPS"

[[option.choice]]
value = "144"
label = "144 FPS"

[[option.choice]]
value = "165"
label = "165 FPS"

[[option.choice]]
value = "240"
label = "240 FPS"

[[option.choice]]
value = "display"
label = "Display refresh (Recommended)"

[[plugin]]
feature = "temporal-blending"
id = "ape.framerate.60"
when = { rate = "60" }

[[plugin]]
feature = "temporal-blending"
id = "ape.framerate.120"
when = { rate = "120" }

[[plugin]]
feature = "temporal-blending"
id = "ape.framerate.144"
when = { rate = "144" }

[[plugin]]
feature = "temporal-blending"
id = "ape.framerate.165"
when = { rate = "165" }

[[plugin]]
feature = "temporal-blending"
id = "ape.framerate.uncapped"
when = { rate = "display" }

[[plugin]]
feature = "temporal-blending"
id = "ape.frame-smoothing.90"
when = { rate = "90" }

[[plugin]]
feature = "temporal-blending"
id = "ape.frame-smoothing.240"
when = { rate = "240" }
