schema = 1

[product]
name = "ApeEscapeRecomp"
display_name = "Ape Escape"
exe_name = "ApeEscapeRecomp"
version_file = "packaging/release/VERSION"
player_game_toml = "game.toml"

[build]
cmake_args = ["-DPSX_RECOMP_UI=ON", "-DPSX_ENABLE_VULKAN=ON"]

[aot]
mode = "cache"
profile = "aot/overlays.json"
cps = false

[overlay_toolchain]
ship = true

[payload]
start_here = "packaging/release/OPTIMIZATION_START_HERE.txt"
files = ["README.md", "RELEASE_NOTES.md", {from="packaging/release/input.ini", to="input.ini"}]
